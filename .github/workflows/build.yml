name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Décompresser le zip le plus récent
        run: |
          LATEST=$(git log --name-only --pretty=format: -- '*.zip' | grep '\.zip$' | head -n 1 || true)
          echo "Zip utilisé : $LATEST"
          unzip -oq "$LATEST" -d unzipped
      - name: Compiler
        run: |
          cd "$(dirname "$(find unzipped -maxdepth 4 -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TeleWidget-apk
          path: unzipped/**/app/build/outputs/apk/debug/app-debug.apk
